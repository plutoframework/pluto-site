name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false
      - uses: jdx/mise-action@v3
        with:
          install_args: golangci-lint@2.15.0
      - run: python3 scripts/test-doc-markdown.py
      - run: python3 scripts/format-go-docs.py
      - run: npm --prefix docs ci
      - run: npm --prefix docs run build
      - run: python3 scripts/docs-smoke.py
      - name: Check static site
        run: python3 scripts/check.py
      - uses: actions/configure-pages@v5
      - name: Assemble public files
        run: |
          python3 scripts/build-site.py
          python3 scripts/check-docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
