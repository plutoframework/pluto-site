name: Pluto CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.5"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install pinned linter
        run: GOTOOLCHAIN=go1.26.0 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm --prefix docs ci
      - run: python3 scripts/test-doc-markdown.py
      - run: python3 scripts/format-go-docs.py
      - run: npm --prefix docs run build
      - run: python3 scripts/docs-smoke.py
      - run: python3 scripts/check.py
      - run: python3 scripts/build-site.py
      - run: python3 scripts/check-docs.py
